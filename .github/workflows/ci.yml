name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile all modules
        run: python -m py_compile server.py config.py policy.py zap_client.py tools/*.py

      - name: Run tests
        env:
          # A dummy key so config validation (fail-closed) is satisfied in CI;
          # no real ZAP instance is contacted (tests use mocks).
          ZAP_API_KEY: ci-test-key
        run: pytest -q
