# OWASP ZAP MCP server - container orchestration.
#
# Secrets are provided via a local .env file (see .env.example); the API key is
# never hard-coded here. The ZAP daemon's API port is published only on the
# loopback interface so it is not exposed on every host interface.
services:
  # One-shot permission fixer for the shared work directory.
  #
  # Docker seeds a new named volume from the image's directory metadata, and
  # /zap/wrk ships as root:root 0755. Both real services run unprivileged (ZAP as
  # uid 1000, the MCP server as uid 10001), so neither could write there and
  # report generation failed with a permission error. This runs as root before
  # ZAP starts and hands the directory to the zap group:
  #   - owner 1000:1000        -> ZAP writes as the owner
  #   - mode 2775 (setgid)     -> group members write, and files created by
  #                               either service inherit gid 1000 automatically,
  #                               so the two containers can always read each
  #                               other's files.
  # The MCP server joins gid 1000 via `group_add` below.
  #
  # Reuses the ZAP image purely to avoid pulling anything extra; it exits
  # immediately and does not stay running.
  wrk-init:
    image: zaproxy/zap-stable:2.17.0
    container_name: zap-wrk-init
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - chown 1000:1000 /zap/wrk && chmod 2775 /zap/wrk
    volumes:
      - zap-wrk:/zap/wrk
    # Touches only a volume; needs no network at all.
    network_mode: none
    restart: "no"

  zap:
    # Pinned to the version this stack was validated against. Bump deliberately.
    image: zaproxy/zap-stable:2.17.0
    container_name: zap-daemon
    user: zap
    # List form -> exec'd directly (no shell), so regex metacharacters below are
    # passed literally. The API address is restricted to loopback + RFC1918
    # private ranges so only localhost and containers on the internal network can
    # reach the API; external hosts are refused even before the API key check.
    command:
      - zap.sh
      - -daemon
      - -host
      - "0.0.0.0"
      - -port
      - "8080"
      - -config
      - "api.addrs.addr.name=^(127\\.0\\.0\\.1|10\\..*|172\\.(1[6-9]|2[0-9]|3[01])\\..*|192\\.168\\..*|localhost|zap)$"
      - -config
      - "api.addrs.addr.regex=true"
      - -config
      - "api.key=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env}"
    # Publish the ZAP API/proxy only to localhost. Other containers still reach
    # it over the internal network by service name; it is not world-exposed.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - zap-wrk:/zap/wrk
    networks:
      - zapnet
    # Do not start until the shared work directory is writable.
    depends_on:
      wrk-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - >
          curl -sf
          "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY}"
          || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: zap-mcp-server
    container_name: zap-mcp-server
    # SECURITY: the MCP control endpoint has NO built-in authentication and can
    # launch attack traffic. It is therefore published only on localhost. To
    # expose it deliberately, override MCP_BIND (e.g. MCP_BIND=0.0.0.0) AND put
    # an authenticating reverse proxy in front of it. Do not expose it raw.
    ports:
      - "${MCP_BIND:-127.0.0.1}:8000:8000"
    environment:
      - ZAP_BASE_URL=http://zap:8080
      - ZAP_API_KEY=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Optional engagement-scope controls (see .env.example):
      - ZAP_TARGET_ALLOWLIST=${ZAP_TARGET_ALLOWLIST:-}
      - ZAP_BLOCK_PRIVATE_TARGETS=${ZAP_BLOCK_PRIVATE_TARGETS:-false}
    depends_on:
      zap:
        condition: service_healthy
    # Shared work directory. ZAP interprets every file path in its API (report
    # output, HAR / OpenAPI / URL-list / automation-plan imports) against its OWN
    # filesystem, so the MCP server must see the same directory at the same path
    # for those tools to be usable: the agent stages an input file here and ZAP
    # reads it, or ZAP writes a report here and the agent reads it back.
    volumes:
      - zap-wrk:/zap/wrk
    # Join ZAP's group (gid 1000) so the unprivileged appuser can write to the
    # setgid-shared directory prepared by wrk-init.
    group_add:
      - "1000"
    networks:
      - zapnet
    restart: unless-stopped

volumes:
  zap-wrk:

networks:
  # Managed by this compose file (not external) so a fresh `up` works cleanly.
  zapnet:
    driver: bridge
